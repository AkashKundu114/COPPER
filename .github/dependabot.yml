version: 2
updates:
  # Python backend dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # React/Vite frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

  # Backend container base images
  - package-ecosystem: "docker"
    directory: "/infrastructure/docker/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker", "backend"]
    commit-message:
      prefix: "chore(docker)"

  # Frontend container base images
  - package-ecosystem: "docker"
    directory: "/infrastructure/docker/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker", "frontend"]
    commit-message:
      prefix: "chore(docker)"
