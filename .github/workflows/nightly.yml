name: Nightly Build & Extended Tests

on:
  schedule:
    - cron: '0 2 * * *' # Nightly at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  full-matrix-test:
    name: Extended Test Matrix (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short

  frontend-cross-platform-build:
    name: Frontend & Desktop Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build web assets
        run: cd frontend && npm run build

      - name: Build desktop application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: cd frontend && npm run desktop:build

      - name: Verify desktop artifacts
        shell: bash
        run: |
          cd frontend/dist-electron
          echo "Built desktop artifacts for ${{ matrix.os }}:"
          ls -la
          case "${{ matrix.os }}" in
            ubuntu-latest)
              if compgen -G "*.AppImage" > /dev/null && compgen -G "*.deb" > /dev/null; then
                echo "Linux .AppImage and .deb artifacts verified successfully."
              else
                echo "::error::Missing expected Linux artifacts (.AppImage or .deb)"
                exit 1
              fi
              ;;
            macos-latest)
              if compgen -G "*.dmg" > /dev/null; then
                echo "macOS .dmg artifact verified successfully."
              else
                echo "::error::Missing expected macOS artifact (.dmg)"
                exit 1
              fi
              ;;
            windows-latest)
              if compgen -G "*.exe" > /dev/null; then
                echo "Windows .exe installer verified successfully."
              else
                echo "::error::Missing expected Windows artifact (.exe)"
                exit 1
              fi
              ;;
          esac

  stale-housekeeping:
    name: Mark Stale Issues & PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-message: >
            This issue has been automatically marked stale due to 45 days of inactivity.
            It will be closed in 14 days unless further activity occurs.
          stale-pr-message: >
            This pull request has been automatically marked stale due to 45 days of inactivity.
            It will be closed in 14 days unless further activity occurs.
          exempt-issue-labels: 'pinned,security,bug: critical'
          exempt-pr-labels: 'pinned,work-in-progress'
