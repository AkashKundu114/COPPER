name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Artifacts & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package frontend build artifact
        run: |
          cd frontend
          tar -czf "../copper-frontend-${{ github.ref_name }}.tar.gz" dist

      - name: Package backend source artifact
        run: |
          tar -czf "copper-backend-${{ github.ref_name }}.tar.gz" backend

      - name: Generate release notes from commit log
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..${{ github.ref_name }}" --pretty=format:"- %s (%h)"
            else
              git log --pretty=format:"- %s (%h)"
            fi
            echo ""
            echo ""
            echo "## Container Images"
            echo "- \`ghcr.io/${{ github.repository }}-backend:${{ github.ref_name }}\`"
            echo "- \`ghcr.io/${{ github.repository }}-frontend:${{ github.ref_name }}\`"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            copper-frontend-${{ github.ref_name }}.tar.gz
            copper-backend-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
