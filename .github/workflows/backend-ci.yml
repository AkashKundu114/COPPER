name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'conftest.py'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'conftest.py'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Ruff lint (GitHub annotations)
        run: |
          cd backend
          ruff check app/ --output-format=github

      - name: Ruff format check
        run: |
          cd backend
          ruff format --check app/

  typecheck:
    name: Static Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install mypy types-redis

      - name: Run mypy
        # Non-blocking while the codebase migrates to full strict typing.
        # Findings still surface as annotations on the PR for visibility.
        continue-on-error: true
        run: |
          cd backend
          mypy app/ --ignore-missing-imports --no-strict-optional --pretty

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copper
          POSTGRES_PASSWORD: copperpass
          POSTGRES_DB: copperdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copper"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run test suite with coverage
        env:
          DATABASE_URL: postgresql://copper:copperpass@localhost:5432/copperdb_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=backend/app --cov-report=xml --cov-report=term-missing \
            --junitxml=pytest-results-${{ matrix.python-version }}.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          retention-days: 14

  routing-benchmark:
    name: Routing & Guardian Benchmark Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run evaluation benchmark suite
        run: python backend/eval/benchmark.py

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            backend/eval/benchmark_report.md
            backend/eval/benchmark_metrics.json
          retention-days: 30

      - name: Enforce accuracy regression gate
        run: |
          python - <<'PYEOF'
          import json, sys
          data = json.load(open("backend/eval/benchmark_metrics.json"))
          routing_acc = data["routing"]["overall_accuracy_pct"]
          guardian_acc = data["guardian"]["accuracy_pct"]
          print(f"Routing accuracy:  {routing_acc}%")
          print(f"Guardian accuracy: {guardian_acc}%")
          MIN_ROUTING = 97.0
          MIN_GUARDIAN = 99.0
          if routing_acc < MIN_ROUTING or guardian_acc < MIN_GUARDIAN:
              print(f"::error::Benchmark accuracy regressed below required threshold "
                    f"(routing >= {MIN_ROUTING}%, guardian >= {MIN_GUARDIAN}%)")
              sys.exit(1)
          print("Benchmark gate passed.")
          PYEOF

  security:
    name: Security Scan (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Bandit static analysis
        run: |
          cd backend
          bandit -r app/ -ll -f json -o bandit-report.json || true
          bandit -r app/ -ll

      - name: pip-audit dependency vulnerability scan
        run: |
          cd backend
          pip-audit -r requirements.txt --desc || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

  ci-summary:
    name: Backend CI Summary (required check)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, routing-benchmark, security]
    if: always()
    steps:
      - name: Evaluate required jobs
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.routing-benchmark.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::One or more required backend CI jobs failed."
            exit 1
          fi
          echo "All required backend CI checks passed."
