name: Backend CI

on:
  push:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Static Analysis & Linting (Gate 1)
        run: |
          cd backend
          ruff check app/

      - name: Formatting Check (Gate 2)
        run: |
          cd backend
          ruff format --check app/

      - name: Run Tests & Coverage (Gate 3)
        run: |
          cd backend
          pytest ../tests/ -v --tb=short
