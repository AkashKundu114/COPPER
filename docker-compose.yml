services:
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    container_name: copper-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    container_name: copper-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://copper:copperpass@postgres:5432/copperdb
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    depends_on:
      - postgres
      - redis
      - chromadb
      - ollama

  postgres:
    image: postgres:16
    container_name: copper-postgres
    restart: always
    environment:
      POSTGRES_USER: copper
      POSTGRES_PASSWORD: copperpass
      POSTGRES_DB: copperdb
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: copper-redis
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma
    container_name: copper-chromadb
    ports:
      - "8001:8000"

  ollama:
    image: ollama/ollama
    container_name: copper-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  searxng:
    image: searxng/searxng:latest
    container_name: copper-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888

  tempo:
    image: grafana/tempo:2.4.1
    container_name: copper-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - tempo_data:/var/tempo
      - ./infrastructure/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

volumes:
  ollama:
  tempo_data:
