[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "UP042", "E712", "B904", "B007", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.optional-dependencies]
training = ["unsloth", "peft", "trl", "transformers", "datasets", "bitsandbytes"]