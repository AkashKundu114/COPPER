apiVersion: apps/v1
kind: Deployment
metadata:
  name: copper-backend
  namespace: copper
  labels:
    app: copper-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: copper-backend
  template:
    metadata:
      labels:
        app: copper-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/copper/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: copper-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: copper
spec:
  selector:
    app: copper-backend
  ports:
    - port: 8000
      targetPort: 8000
