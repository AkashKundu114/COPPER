<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background chip body -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>

  <!-- Chip die -->
  <rect x="18" y="18" width="28" height="28" rx="5" fill="#ff7c1f"/>

  <!-- Inner grid lines -->
  <line x1="25" y1="18" x2="25" y2="46" stroke="#0a0a0f" stroke-width="1.5" opacity="0.4"/>
  <line x1="32" y1="18" x2="32" y2="46" stroke="#0a0a0f" stroke-width="1.5" opacity="0.4"/>
  <line x1="39" y1="18" x2="39" y2="46" stroke="#0a0a0f" stroke-width="1.5" opacity="0.4"/>
  <line x1="18" y1="25" x2="46" y2="25" stroke="#0a0a0f" stroke-width="1.5" opacity="0.4"/>
  <line x1="18" y1="32" x2="46" y2="32" stroke="#0a0a0f" stroke-width="1.5" opacity="0.4"/>
  <line x1="18" y1="39" x2="46" y2="39" stroke="#0a0a0f" stroke-width="1.5" opacity="0.4"/>

  <!-- Pins — top -->
  <rect x="24" y="11" width="4" height="7" rx="2" fill="#ff7c1f"/>
  <rect x="36" y="11" width="4" height="7" rx="2" fill="#ff7c1f"/>

  <!-- Pins — bottom -->
  <rect x="24" y="46" width="4" height="7" rx="2" fill="#ff7c1f"/>
  <rect x="36" y="46" width="4" height="7" rx="2" fill="#ff7c1f"/>

  <!-- Pins — left -->
  <rect x="11" y="24" width="7" height="4" rx="2" fill="#ff7c1f"/>
  <rect x="11" y="36" width="7" height="4" rx="2" fill="#ff7c1f"/>

  <!-- Pins — right -->
  <rect x="46" y="24" width="7" height="4" rx="2" fill="#ff7c1f"/>
  <rect x="46" y="36" width="7" height="4" rx="2" fill="#ff7c1f"/>

  <!-- Centre highlight dot -->
  <circle cx="32" cy="32" r="4" fill="#fff" opacity="0.9"/>
</svg>
