# SearXNG configuration for C.O.P.P.E.R. Local Web Search
use_default_settings: true

server:
  secret_key: copper_searxng_secret_key_offline_first
  base_url: http://localhost:8888
  bind_address: 0.0.0.0
  port: 8080

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
